creatures.domestic-dog-guard-hunting.name: Domestic Dog (Guard / Hunting)
creatures.domestic-dog-guard-hunting.description: |-
  *A medium-to-large dog trained to guard, hunt or track. Loyal, fast, and able to pin down an unarmed person.*

  **Type:** Animal (canid) · **Size:** x1/2 · **Weight:** 35 kg · **Threat:** Low

  **Speed:** 14 (base 11): 38 km/h, 32 m/round

  **Attacks:**

  - Bite: skill 10, damage +2, DMAX 4, total +0

  **Skills:** Dodge 10, Perception 13, Tracking 13 (by scent), Stealth 9, Run 15, Swimming 10

  **Special**

  - **Keen Smell.** +I to Perception and Tracking rolls based on scent.
  - **Trainable.** Can be trained with Animal Handling to obey simple commands.

  **Variants**

  - **War Dog / Mastiff** (70 kg): STR 6, END 7. Recompute derived values.
  - **Hunting Hound:** SPD base 12, Tracking +3.
creatures.wolf.name: Wolf
creatures.wolf.description: |-
  *A wild pack hunter: patient, tireless and wary of humans unless starving.*

  **Type:** Animal (canid) · **Size:** x1/2 · **Weight:** 40 kg · **Threat:** Low (Moderate in packs)

  **Speed:** 14 (base 11): 38 km/h, 32 m/round

