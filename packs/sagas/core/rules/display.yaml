# How a sheet shows the character (display hints: never part of the calculations): the fields
# by theme, then the copies.
# Only what exists at the universe's technological level matters. Every skill is a standard copy
# on every sheet: one above the level shows only once raised (its points kept, say after a change
# of universe). Weapons and armor above it go to hidden groups too, so an app doesn't offer them;
# one the character carries still shows (a group holding a copy that isn't standard always does).
# While the character is being created, only the creation actions show: the actions of play
# (checks, combat, health, dangers, the long-term action, progression) wait for the character.
display:
  groups:
    - id: act-checks
      kind: actions
      priority: 20
      showWhen: '!character.creating'
      members:
        type: action
        where: >-
          'check' in item.tags && !('combat' in item.tags) && !(item.id in ['sagas-core:long-start', 'sagas-core:long-step'])
    - id: act-combat
      kind: actions
      priority: 21
      showWhen: '!character.creating'
      members:
        type: action
        where: >-
          ('combat' in item.tags || 'damage' in item.tags) && !('danger' in item.tags)
    - id: act-health
      kind: actions
      priority: 22
      showWhen: '!character.creating'
      members:
        type: action
        where: >-
          'health' in item.tags && !('danger' in item.tags)
    - id: act-dangers
      kind: actions
      priority: 23
      showWhen: '!character.creating'
      members:
        type: action
        where: >-
          'danger' in item.tags
    - id: act-long-term
      kind: actions
      priority: 24
      showWhen: '!character.creating'
      members:
        type: action
        where: >-
          item.id in ['sagas-core:long-start', 'sagas-core:long-step']
    - id: act-advancement
      kind: actions
      priority: 25
      showWhen: '!character.creating'
      members:
        type: action
        where: >-
          'advancement' in item.tags || item.id == 'sagas-core:learn-specialty'
    - id: act-creation
      kind: actions
      priority: 26
      showWhen: 'character.creating'
      members:
        type: action
        where: >-
          'creation' in item.tags
    - id: identity
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@identity.name, @identity.species, @identity.profession, @identity.description, @identity.background, @identity.possessions]
    - id: characteristics
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@chars.str, @chars.agi, @chars.end, @chars.dex, @chars.wit, @chars.wil, @chars.pre, @chars.ins]
    - id: secondary
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@sec.cco, @sec.rco, @sec.spd, @sec.ini, @species.speed]
    - id: derived
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@bonus.str, @bonus.pre, @shock.physical, @shock.psychical, @protection, @armor.bullets, @armor.resilient, @impact.max, @dodge.reflex, @dodge.learning, @study.limit, @breath.rounds]
    - id: health
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@hp.physical.max, @injury.physical, @stun.physical, @damage.physical, @hp.psychical.max, @injury.psychical, @stun.psychical, @damage.psychical, @state.fainted, @state.shaken, @state.stabilized, @state.dying, @state.unconscious, @state.dead, @state.confused, @state.mad]
    - id: combat
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@combat.initiative, @bonus.spd, @shield.contact, @shield.missile, @martial.style]
    - id: martial-arts
      priority: 0
      showWhen: "martial.style != 'none'"
      members:
        type: field
        where: >-
          item.id in [@martial.learning, @martial.strike, @martial.projection, @martial.hold, @martial.strength.strike, @martial.strength.projection, @martial.strength.hold, @bonus.martial, @martial.dmax, @martial.twoWeapons]
    - id: long-term
      priority: 0
      showWhen: 'long.active'
      members:
        type: field
        where: >-
          item.id in [@long.total, @long.target, @long.failAt, @long.steps, @long.active]
    - id: progression
      priority: 0
      members:
        type: field
        where: >-
          item.id in [@xp.current, @xp.earned, @universe.techLevel]
    - id: creation-points
      priority: 0
      showWhen: 'character.creating'
      members:
        type: field
        where: >-
          item.id in [@creation.points, @creation.social, @points.budget, @points.chars, @points.secondary, @points.skills, @points.spent, @points.remaining, @creation.cco, @creation.rco, @creation.spd, @creation.ini]
    - id: skills
      kind: content
      priority: 1
      members:
        type: skill
        where: 'item.techLevel <= universe.techLevel || self.learning > self.initial'
    - id: weapons
      kind: content
      priority: 2
      members: { type: weapon, where: 'item.techLevel <= universe.techLevel' }
    - id: armor
      kind: content
      priority: 3
      members: { type: armor, where: 'item.techLevel <= universe.techLevel' }
    - id: skills-beyond
      kind: content
      priority: 9
      showWhen: 'false'
      members:
        type: skill
        where: 'item.techLevel > universe.techLevel && self.learning <= self.initial'
    - id: weapons-beyond
      kind: content
      priority: 9
      showWhen: 'false'
      members: { type: weapon, where: 'item.techLevel > universe.techLevel' }
    - id: armor-beyond
      kind: content
      priority: 9
      showWhen: 'false'
      members: { type: armor, where: 'item.techLevel > universe.techLevel' }
