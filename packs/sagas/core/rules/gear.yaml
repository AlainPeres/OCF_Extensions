contentTypes:
  weapon:
    carried: true
    equippable: true
    fields:
      kind: { type: enum, values: [melee, ranged], required: true }
      skill: { type: id, of: skill }
      damageBonus: { type: integer, required: true }
      # Below the required Strength the wielder suffers a degree of -I.
      strReq: { type: integer, default: 0, min: 0 }
      # Maximum weapon effect dice.
      dmax: { type: integer, required: true, min: 1 }
      size: { type: integer, min: 1 }
      # Range on the Universal Table (ranged weapons).
      range: { type: integer, min: 0 }
      # Armor piercing (AP): each point above the target's resilient armor (RA) halves its
      # protection.
      ap: { type: integer, default: 0, min: 0 }
      techLevel: { type: integer, default: 0, min: 0 }
      # Burst, area or range-dependent damage: read the rules.
      special: { type: boolean, default: false }
      # Firearms of section 14.3: shots in the magazine, rate of fire (bursts a round), weight in
      # kg, and whether it needs a tripod (no required Strength then).
      shots: { type: integer, min: 1 }
      rof: { type: integer, min: 1 }
      weight: { type: decimal, min: 0 }
      tripod: { type: boolean, default: false }
      # A creature's attack (rules/creatures.yaml): rolled at its own score, the copy's, with no
      # skill.
      natural: { type: boolean, default: false }
    state:
      # A natural weapon's attack score (the bestiary's), set by the creature start.
      score: { type: integer, default: 0, min: 0 }
    actions:
      - use: natural-attack
        available: item.natural
        params:
          score: self.score
      - use: damage
        params:
          weaponBonus: item.damageBonus
          melee: "item.kind == 'melee'"
          dmax: item.dmax

  armor:
    carried: true
    equippable: true
    fields:
      protection: { type: integer, required: true, min: 0 }
      # Resilient armor (RA): armor piercing counts only above it.
      resilient: { type: integer, default: 0, min: 0 }
      # Protection against bullets and impact, when higher.
      bulletProtection: { type: integer, min: 0 }
      helmet: { type: boolean, default: false }
      # Shield parry, in degrees against a contact attack and a normal projectile.
      parryContact: { type: integer, default: 0, min: 0 }
      parryProjectile: { type: integer, default: 0, min: 0 }
      # A small shield parries one contact attack only.
      singleContact: { type: boolean, default: false }
      techLevel: { type: integer, default: 0, min: 0 }
    effectsWhen: self.equipped
    effects:
      - id: protection
        target: protection
        op: add
        value: item.protection
      # Against bullets and impact: its bullet protection when it has one, else its protection.
      - id: bullets
        target: armor.bullets
        op: add
        value: 'has(item.bulletProtection) ? item.bulletProtection : item.protection'
      - id: resilient
        target: armor.resilient
        op: atLeast
        value: item.resilient
      # A shield's parry bonus (the best shield's).
      - id: shield-contact
        target: shield.contact
        op: atLeast
        value: item.parryContact
      - id: shield-missile
        target: shield.missile
        op: atLeast
        value: item.parryProjectile
