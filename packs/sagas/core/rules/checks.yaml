# SagaS roll: two open d6 (a 6 is rerolled and added) rolled under a score.
# Degree = floor(score / roll) when the roll is at most the score, else 0.
# More than twice the score is an automatic failure: the degree stays 0.
resultBands:
  degree:
    value: 'roll.total > 2 * flags.score ? 0 : max(0, (roll.total <= flags.score ? floor(flags.score / roll.total) : 0) + flags.modifier)'
    bands:
      # A natural 2 (1 and 1 on the first dice) that gives a success.
      - { id: natural-two, when: 'roll.faces[0] == 1 && roll.faces[1] == 1 && roll.value >= 1' }
      # A natural 12 (6 and 6 on the first dice) ending in failure: a possible fumble.
      - { id: natural-twelve, when: 'roll.faces[0] == 6 && roll.faces[1] == 6 && roll.value == 0' }
      - { id: success, success: true, when: 'roll.value >= 1' }
      - { id: automatic-failure, when: 'roll.total > 2 * flags.score' }
      - { id: failure, when: true }

situational:
  - id: attackInBack
    type: boolean
    default: false
    rolls: [check]
  - id: surprise
    type: boolean
    default: false
    rolls: [check]
  - id: calledShot
    type: boolean
    default: false
    rolls: [check]
  - id: secondaryHand
    type: boolean
    default: false
    rolls: [check]
  - id: prone
    type: boolean
    default: false
    rolls: [check]
  - id: opponentBehind
    type: boolean
    default: false
    rolls: [check]
  - id: helpless
    type: boolean
    default: false
    rolls: [check]
  - id: strengthBelowMinimum
    type: boolean
    default: false
    rolls: [check]
  - id: aim
    type: boolean
    default: false
    rolls: [check]
  - id: singleTargetBurst
    type: boolean
    default: false
    rolls: [check]
  - id: pointBlank
    type: boolean
    default: false
    rolls: [check]
  - id: charging
    type: boolean
    default: false
    rolls: [check]
  # Combat modifiers (section 12), the attacker's and the defender's.
  - id: invisibleMelee
    type: boolean
    default: false
    rolls: [check]
  - id: invisibleRanged
    type: boolean
    default: false
    rolls: [check]
  - id: defendInvisible
    type: boolean
    default: false
    rolls: [check]
  - id: rangeShort
    type: boolean
    default: false
    rolls: [check]
  - id: rangeLong
    type: boolean
    default: false
    rolls: [check]
  - id: rangeExtreme
    type: boolean
    default: false
    rolls: [check]
  - id: concealed
    type: boolean
    default: false
    rolls: [check]
  - id: concealedMostly
    type: boolean
    default: false
    rolls: [check]
  - id: shotgun
    type: boolean
    default: false
    rolls: [check]
  - id: moveBy
    type: boolean
    default: false
    rolls: [check]
  - id: stunBlunt
    type: boolean
    default: false
    rolls: [check]
  - id: stunEdged
    type: boolean
    default: false
    rolls: [check]
  - id: parryBareHands
    type: boolean
    default: false
    rolls: [check]
  - id: parryLargerWeapon
    type: boolean
    default: false
    rolls: [check]
  - id: parryFastMissile
    type: boolean
    default: false
    rolls: [check]
  - id: parryStrongCreature
    type: boolean
    default: false
    rolls: [check]
  - id: shieldContact
    type: boolean
    default: false
    rolls: [check]
  - id: shieldMissile
    type: boolean
    default: false
    rolls: [check]
actions:
  # The 2d6* roll under a score. Degree modifiers (difficulty, situation) are added to the degree.
  - id: degree-roll
    listed: false
    tags: [check]
    params:
      score: { type: integer }
      modifier: { type: integer, default: 0 }
      difficulty:
        {
          type: enum,
          values:
            [
              obvious,
              very-easy,
              easy,
              normal,
              difficult,
              very-difficult,
              extremely-difficult,
              almost-impossible,
              theoretically-impossible,
            ],
          default: normal,
        }
    results: { bands: degree }
    steps:
      - id: target
        kind: branch
        cases:
          - when: true
            flags:
              score: params.score
              modifier: "params.modifier + [4, 2, 1, 0, -1, -2, -3, -4, -8][indexOf(['obvious', 'very-easy', 'easy', 'normal', 'difficult', 'very-difficult', 'extremely-difficult', 'almost-impossible', 'theoretically-impossible'], params.difficulty)] + (situational.attackInBack ? 1 : 0) + (situational.surprise ? 1 : 0) + (situational.calledShot ? -1 : 0) + (situational.secondaryHand ? -1 : 0) + (situational.prone ? -1 : 0) + (situational.opponentBehind ? -1 : 0) + (situational.helpless ? 4 : 0) + (situational.strengthBelowMinimum ? -1 : 0) + (situational.aim ? 1 : 0) + (situational.singleTargetBurst ? 1 : 0) + (situational.pointBlank ? 1 : 0) + (situational.charging ? -1 : 0) + (situational.invisibleMelee ? -1 : 0) + (situational.invisibleRanged ? -2 : 0) + (situational.defendInvisible ? -1 : 0) + (situational.rangeShort ? 1 : 0) + (situational.rangeLong ? -1 : 0) + (situational.rangeExtreme ? -2 : 0) + (situational.concealed ? -1 : 0) + (situational.concealedMostly ? -2 : 0) + (situational.shotgun ? 1 : 0) + (situational.moveBy ? -1 : 0) + (situational.stunBlunt ? -1 : 0) + (situational.stunEdged ? -2 : 0) + (situational.parryBareHands ? -1 : 0) + (situational.parryLargerWeapon ? -1 : 0) + (situational.parryFastMissile ? -1 : 0) + (situational.parryStrongCreature ? -2 : 0) + (situational.shieldContact ? shield.contact : 0) + (situational.shieldMissile ? shield.missile : 0)"
      - id: check
        kind: roll
        tags: [check]
        better: low
        bands: degree
        parts:
          - dice: 2d6!
      - id: result
        kind: outcome
        result: steps.check.band
        data:
          degree: steps.check.bandValue

  - id: characteristic-check
    tags: [check]
    params:
      characteristic: { type: id, of: field, where: "'characteristic' in item.tags" }
      modifier: { type: integer, default: 0 }
      difficulty:
        {
          type: enum,
          values:
            [
              obvious,
              very-easy,
              easy,
              normal,
              difficult,
              very-difficult,
              extremely-difficult,
              almost-impossible,
              theoretically-impossible,
            ],
          default: normal,
        }
    results: { bands: degree }
    steps:
      - id: roll
        kind: action
        use: degree-roll
        params:
          score: params.characteristic.value
          modifier: params.modifier
          difficulty: params.difficulty
      - id: result
        kind: outcome
        result: steps.roll.result
        data:
          degree: steps.roll.data.degree

  # A skill roll, under its total level. Optionally (section 4), with the help of other
  # characters (their skill totals: the first adds half, the second a quarter, the third an
  # eighth), with a neighboring skill instead (half its total, for a skill not learned), or with a
  # skill used at the same time (two weapons, fighting on a mount: the weaker total counts).
  # 0 means none.
  - id: skill-check
    tags: [check]
    params:
      characteristic: { type: id, of: field, where: "'characteristic' in item.tags" }
      learning: { type: integer }
      modifier: { type: integer, default: 0 }
      help1: { type: integer, default: 0, min: 0 }
      help2: { type: integer, default: 0, min: 0 }
      help3: { type: integer, default: 0, min: 0 }
      neighbor: { type: integer, default: 0, min: 0 }
      together: { type: integer, default: 0, min: 0 }
      difficulty:
        {
          type: enum,
          values:
            [
              obvious,
              very-easy,
              easy,
              normal,
              difficult,
              very-difficult,
              extremely-difficult,
              almost-impossible,
              theoretically-impossible,
            ],
          default: normal,
        }
    results: { bands: degree }
    steps:
      - id: base
        kind: branch
        cases:
          - when: true
            flags:
              own: 'params.neighbor > 0 ? floor(params.neighbor / 2) : params.characteristic.value + params.learning'
      - id: score
        kind: branch
        cases:
          - when: true
            flags:
              score: >-
                (params.together > 0 ? min(flags.own, params.together) : flags.own)
                  + floor(params.help1 / 2) + floor(params.help2 / 4) + floor(params.help3 / 8)
      - id: roll
        kind: action
        use: degree-roll
        params:
          score: flags.score
          modifier: params.modifier
          difficulty: params.difficulty
      - id: result
        kind: outcome
        result: steps.roll.result
        data:
          degree: steps.roll.data.degree

  # Opposed action: each side rolls; the degree of success is the difference of degrees. The
  # winner has a degree of at least I and a strictly positive degree of success.
  - id: opposed-check
    tags: [check]
    params:
      score: { type: integer }
      opponentScore: { type: integer }
      modifier: { type: integer, default: 0 }
      opponentModifier: { type: integer, default: 0 }
    results: [won, lost, draw]
    steps:
      - id: mine
        kind: action
        use: degree-roll
        params:
          score: params.score
          modifier: params.modifier
      - id: theirs
        kind: action
        use: degree-roll
        params:
          score: params.opponentScore
          modifier: params.opponentModifier
      - id: result
        kind: outcome
        result: "steps.mine.data.degree >= 1 && steps.mine.data.degree > steps.theirs.data.degree ? 'won' : steps.theirs.data.degree >= 1 && steps.theirs.data.degree > steps.mine.data.degree ? 'lost' : 'draw'"
        data:
          degreeOfSuccess: steps.mine.data.degree - steps.theirs.data.degree

  # Damage = Nd6* + weapon bonus (+ Strength bonus in melee); N is the degree of success, at most
  # the weapon's maximum effect dice (DMAX; 0 for no limit). Extra dice, within the DMAX too: one
  # per burst fired at the target (automatic weapons) or per bullet beyond the first
  # (semi-automatic, 3 at most). A charge (7.2) adds twice the Speed bonus to the Strength bonus,
  # the two together limited to the Maximum Impact Bonus.
  - id: damage
    tags: [damage]
    params:
      degree: { type: integer, min: 1 }
      weaponBonus: { type: integer, default: 0 }
      melee: { type: boolean, default: true }
      dmax: { type: integer, default: 0, min: 0 }
      extraDice: { type: integer, default: 0, min: 0 }
      charge: { type: boolean, default: false }
    results: [dealt]
    steps:
      - id: count
        kind: branch
        cases:
          - when: true
            flags:
              dice: 'params.dmax > 0 ? min(params.degree + params.extraDice, params.dmax) : params.degree + params.extraDice'
              strength: 'params.melee ? (params.charge ? min(impact.max, bonus.str + 2 * bonus.spd) : bonus.str) : 0'
      - id: roll
        kind: roll
        tags: [damage]
        parts:
          - dice: '(flags.dice)d6!'
          - value: params.weaponBonus
          - value: flags.strength
      - id: result
        kind: outcome
        result: "'dealt'"
        data:
          damage: steps.roll.total
          dice: flags.dice

  # Physical or psychical damage, as injury or as stun. Physical damage is first reduced by the
  # armor's protection (its bullet protection against bullets or impact, when higher), halved for
  # each point of the attack's armor piercing above the armor's resilience (section 7.4), unless
  # the damage ignores armor. Stun
  # reaching the hit points turns further stun into injury. Damage above the shock threshold
  # calls for a shock roll (Endurance for physical, Presence for psychical): a degree of 0 faints
  # or confuses.
  - id: take-damage
    tags: [health]
    params:
      kind: { type: enum, values: [physical, psychical] }
      amount: { type: integer, min: 0 }
      stun: { type: boolean, default: false }
      armorPiercing: { type: integer, default: 0, min: 0 }
      ignoreArmor: { type: boolean, default: false }
      # Bullets or impact: the armor's bullet protection counts when higher (a Kevlar vest).
      bullets: { type: boolean, default: false }
    results: [taken, shock-failed]
    steps:
      # The protection, halved for each point of armor piercing above the armor's resilience.
      - id: armor
        kind: branch
        cases:
          - when: true
            flags:
              base: 'params.bullets ? max(protection, armor.bullets) : protection'
              halvings: min(4, max(0, params.armorPiercing - armor.resilient))
      - id: split
        kind: branch
        cases:
          - when: "params.kind == 'physical'"
            flags:
              room: hp.physical.max - stun.physical
              threshold: shock.physical
              absorbed: 'params.ignoreArmor ? 0 : min(params.amount, floor(flags.base / [1, 2, 4, 8, 16][flags.halvings]))'
          - when: true
            flags:
              room: hp.psychical.max - stun.psychical
              threshold: shock.psychical
              absorbed: 0
      - id: absorb
        kind: branch
        cases:
          - when: true
            flags:
              net: params.amount - flags.absorbed
      - id: setup
        kind: branch
        cases:
          - when: true
            flags:
              toStun: 'params.stun ? min(flags.net, flags.room) : 0'
      - id: deal
        kind: changes
        to: self
        changes:
          - {
              type: adjust,
              when: "params.kind == 'physical'",
              field: stun.physical,
              by: flags.toStun,
            }
          - {
              type: adjust,
              when: "params.kind == 'physical'",
              field: injury.physical,
              by: flags.net - flags.toStun,
            }
          - {
              type: adjust,
              when: "params.kind == 'psychical'",
              field: stun.psychical,
              by: flags.toStun,
            }
          - {
              type: adjust,
              when: "params.kind == 'psychical'",
              field: injury.psychical,
              by: flags.net - flags.toStun,
            }
      - id: shock
        kind: action
        when: flags.net > flags.threshold
        use: characteristic-check
        params:
          characteristic: "params.kind == 'physical' ? @chars.end : @chars.pre"
      - id: failed
        kind: branch
        cases:
          - when: true
            flags:
              shockFailed: "has(steps.shock.result) && steps.shock.result != 'success' && steps.shock.result != 'natural-two'"
      # A failed shock roll faints (physical) or confuses (psychical); new physical damage ends a
      # stabilization.
      - id: states
        kind: changes
        to: self
        changes:
          - type: set
            when: "params.kind == 'physical' && flags.net > 0"
            field: state.stabilized
            value: false
          - type: set
            when: "params.kind == 'physical' && flags.shockFailed"
            field: state.fainted
            value: true
          - type: set
            when: "params.kind == 'psychical' && flags.shockFailed"
            field: state.shaken
            value: true
      - id: result
        kind: outcome
        result: "flags.shockFailed ? 'shock-failed' : 'taken'"
        data:
          amount: flags.net
          absorbed: flags.absorbed

  # Ten minutes of rest after damage (section 5.6): stun is fully cured (an unconscious character
  # wakes up, a confused one recovers), and physical injuries drop by 5 per degree of an
  # Endurance roll: some apparent injuries were only scratches. The book allows it after damage
  # was taken: the referee's call, as the sheet doesn't track it.
  - id: rest-short
    tags: [health]
    results: [rested]
    steps:
      - id: endurance
        kind: action
        use: degree-roll
        params:
          score: chars.end
      - id: amount
        kind: branch
        cases:
          - when: true
            flags:
              physical: 'min(injury.physical, 5 * steps.endurance.data.degree)'
      - id: clear
        kind: changes
        to: self
        changes:
          - { type: adjust, field: injury.physical, by: -flags.physical }
          - { type: set, field: stun.physical, value: 0 }
          - { type: set, field: stun.psychical, value: 0 }
          - { type: set, field: state.fainted, value: false }
          - { type: set, field: state.shaken, value: false }
      - id: result
        kind: outcome
        result: "'rested'"
        data: { physical: flags.physical }

  # Once a day after a sleep (section 5.6): stun is fully cured, physical injuries drop by the
  # degree of an Endurance roll (+I with complete rest), psychical injuries by the degree of a
  # Presence roll. In a medical institution, with complete rest, the recovery is doubled. Madness
  # isn't cured here: the referee's call once the psychical injuries are gone.
  - id: rest-day
    tags: [health]
    params:
      completeRest: { type: boolean, default: false }
      medical: { type: boolean, default: false }
    results: [rested]
    steps:
      - id: endurance
        kind: action
        use: degree-roll
        params:
          score: chars.end
          modifier: 'params.completeRest || params.medical ? 1 : 0'
      - id: presence
        kind: action
        use: degree-roll
        params:
          score: chars.pre
      - id: amounts
        kind: branch
        cases:
          - when: true
            flags:
              physical: 'min(injury.physical, steps.endurance.data.degree * (params.medical ? 2 : 1))'
              psychical: 'min(injury.psychical, steps.presence.data.degree * (params.medical ? 2 : 1))'
      - id: heal
        kind: changes
        to: self
        changes:
          - { type: adjust, field: injury.physical, by: -flags.physical }
          - { type: adjust, field: injury.psychical, by: -flags.psychical }
          - { type: set, field: stun.physical, value: 0 }
          - { type: set, field: stun.psychical, value: 0 }
          - { type: set, field: state.fainted, value: false }
          - { type: set, field: state.shaken, value: false }
      - id: result
        kind: outcome
        result: "'rested'"
        data: { physical: flags.physical, psychical: flags.psychical }

  # First aid (section 5.6), as the patient receives it: the helper rolls First Aid on their own
  # sheet, and the patient's player reports the outcome here (no sheet acts on another).
  # woken: out of a faint. stabilized: a dying character stops losing injuries. fumble, on a
  # dying character: complications; the victim dies if an Endurance shock roll fails (the
  # physical injuries go to the death threshold, hit points + Endurance).
  - id: first-aid-received
    tags: [health]
    available: state.fainted || state.dying
    params:
      outcome: { type: enum, values: [woken, stabilized, fumble] }
    results: [woken, stabilized, survived, died]
    steps:
      - id: care
        kind: changes
        to: self
        changes:
          - { type: set, when: "params.outcome == 'woken'", field: state.fainted, value: false }
          - type: set
            when: "params.outcome == 'stabilized'"
            field: state.stabilized
            value: true
      - id: shock
        kind: action
        when: "params.outcome == 'fumble'"
        use: characteristic-check
        params:
          characteristic: '@chars.end'
      - id: failed
        kind: branch
        cases:
          - when: true
            flags:
              dies: "has(steps.shock.result) && steps.shock.result != 'success' && steps.shock.result != 'natural-two'"
      - id: death
        kind: changes
        to: self
        when: flags.dies
        changes:
          - { type: set, field: injury.physical, value: hp.physical.max + chars.end }
      - id: result
        kind: outcome
        result: "params.outcome == 'fumble' ? (flags.dies ? 'died' : 'survived') : params.outcome"

  # Dying (section 5.2): 1 physical injury every 4 rounds (12 s) until first aid stabilizes the
  # character; at hit points + Endurance in injuries, the character dies (state.dead).
  - id: bleed
    tags: [health]
    available: state.dying
    results: [bled, died]
    steps:
      - id: lose
        kind: changes
        to: self
        changes:
          - { type: adjust, field: injury.physical, by: 1 }
      - id: result
        kind: outcome
        result: "injury.physical + 1 >= hp.physical.max + chars.end ? 'died' : 'bled'"
        data: { injuries: injury.physical + 1 }

  # A poison or a disease (section 6.1): at inoculation and at the end of each period, an
  # opposition between the character's Physical Resistance (Endurance + its learning level) and
  # the virulence. A final degree of at least I resists it (not affected, or no longer). First
  # aid's degree (the helper's roll, reported by the player) adds to the final degree. The
  # effects are the referee's.
  - id: resist-poison
    tags: [health]
    params:
      virulence: { type: integer, min: 0 }
      aid: { type: integer, default: 0, min: 0 }
    results: [resisted, affected]
    steps:
      - id: mine
        kind: action
        use: degree-roll
        params:
          score: 'chars.end + sumCopies(copy.state.learning, copy.item == @skills.physical-resistance)'
      - id: theirs
        kind: action
        use: degree-roll
        params:
          score: params.virulence
      - id: final
        kind: branch
        cases:
          - when: true
            flags:
              degree: steps.mine.data.degree - steps.theirs.data.degree + params.aid
      - id: result
        kind: outcome
        result: "flags.degree >= 1 ? 'resisted' : 'affected'"
        data: { degree: flags.degree }
