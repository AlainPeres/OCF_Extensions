# The SRD's skills, archetypes, weapons and armor (scripts/extensions/Eternal_C_Jazz/):
# generated by srd-import.mjs.
skills.administration.name: Administration
skills.administration.description: |-
  A knowledge of how bureaucracies work and what kinds of forms, paperwork, journals, etc. it invariably generates. Use it to sift through detailed financial records or proceedings of club meetings to find that one quirky point that just doesn’t seem to fit the usual pattern.

  Use this skill to rapidly navigate your way adeptly through administrative records to find what’s important. Note that this skill is primarily about interpreting information you have; if you need to actively go out and track down books, records, etc. that would be covered by the Research skill.
skills.military-training.name: Military Training
skills.military-training.description: Many people spend a part of their careers in some form of
  military service to a crown or other empire – whether as part of an army or navy, or even on boats
  in coastal waters. A great many people are also employed in the giant bureaucracy that keeps the
  military supplied and functioning. This skill represents first-hand training and experience
  obtained through time spent in one such military service. Use it to apply military tactics or
  strategies to a situation, to recall specific details about a particular military unit or corps,
  or to know your way around common military-issue equipment.
skills.alertness.name: Alertness
skills.alertness.description: Alertness detects danger. Use it to hear a safety being weapon being
  readied, to understand the mumbling on the other side of a wall, to spot a concealed item hidden
  under a jacket, or to catch someone who is trying to escape notice using Stealth.
skills.natural-world.name: Natural World
skills.natural-world.description: The common understanding of the natural world as practiced by
  farmers, fishermen, and others who make a living based upon the changing patterns of the weather,
  tides, etc. It also covers the broad understanding of the natural habits of animals, as well as
  the different uses of specific plant species. Use this skill to determine whether observed
  behavior of natural forces or creatures is consistent with “normal” or common patterns, or not.
skills.anthropology.name: Anthropology
skills.anthropology.description: The study of living human cultures. Use it to understand morals,
  religious beliefs, customs, and mores, and to identify (but not translate) obscure languages.
  Where History is about the distant past and Archeology studies physical artifacts, Anthropology is
  about the behaviors of living cultures and how they relate to each other and the past.
skills.navigate.name: Navigate
skills.navigate.description: Finding your way quickly with maps, charts and tables, orienteering, compass, or dead reckoning.
skills.appraise.name: Appraise
skills.appraise.description: The ability to quickly determine the true (intrinsic) value of an item.
  This is an important skill in ensuring that bartering exchange deals are favorable to you. It is
  also helpful in know what items or resources others might be willing to trade to obtain.
skills.occult.name: Occult
skills.occult.description: The study of the supernatural as understood by human traditions,
  including things like magick, folklore, and secret societies. Use Occult to examine and deduce the
  intent of a ritual, or to identify occult traditions, groups, grimoires, tools, symbols, or
  legends. Occult can never tell a Protagonist what’s genuinely unnatural and what’s just
  superstition or mythology. That’s the province of the Unnatural skill.
skills.archeology.name: Archeology
skills.archeology.description: The study of physical remains of human cultures. Use it to analyze a
  ruined structure to determine useful information about its purpose long ago or the circumstances
  of its destruction. Where Anthropology is about living cultures and History is a broad study of
  the past, Archeology discerns meaning from the artifacts left behind.
skills.persuade.name: Persuade
skills.persuade.description: |-
  Changing another’s deeply held decision or desire. Use Persuade to get your Protagonist’s way when the subject is so stubborn, what your Protagonist wants is so valuable, or the deception is so flagrant that Charisma isn’t enough.

  With Persuade, your Protagonist might convince a witness that what she saw was innocuous and not unnatural, talk a compound leader into helping you cover up an outbreak to avoid a mass panic, or draw useful information out of an unwilling subject. This skill also allows your Protagonist to resist persuasion and interrogation in opposed Persuade rolls (see OPPOSED TESTS on page 41).
skills.art.name: Art
skills.art.description: 'Expertise at creating or performing a work that sways emotions and
  opinions. It also encompasses knowledge of techniques and trends in your field, and the ability
  tell a particular creator’s real work from a fake. Anyone can draw a rough sketch; the Art skill
  reflects knowledge, practice, and talent. Each type of Art is a separate skill: Acting, Dance,
  Forgery, Music, Poetry, Sculpture, Singing, Storytelling, etc.'
skills.pilot.name: Pilot
skills.pilot.description: 'Piloting, navigating, and captaining waterborne, or airborne vehicles.
  Use it to keep a vessel safe in a crisis, such as through a storm or in a dangerous pursuit. Each
  vessel type is a separate skill: Airplane, Airship, Small Boat, Ship, etc.'
skills.athletics.name: Athletics
skills.athletics.description: |-
  Your Protagonist trains to get the most out of his or her strength and agility. Strength and Dexterity cover raw physical power and manual dexterity; the Athletics skill represents long practice doing things like running, jumping, climbing, and throwing.

  Use Athletics to:

  - Outrun someone (see OPPOSED TESTS on page 41).

  - Jump an intimidating gap.

  - Climb in a crisis.

  - Land safely in a fall of up to three yards.

  - Hit a target with a thrown knife or put a grenade exactly on target.

  - Catch something without warning, such as intercepting a thrown grenade.
skills.psychoanalyze.name: Psychoanalyze
skills.psychoanalyze.description: The diagnosis and treatment of mental illness. Use it to identify
  a mental disorder, help a patient recover, talk someone down when a disorder begins to take over,
  and treat mental illness in the long term. You cannot use Psychoanalysis on yourself. Using
  Psychoanalysis to aid someone who suffered exposure to Cthulhu Mythos forces might cost the
  therapist SAN; see THREATS TO SAN on page 66.
skills.charm.name: Charm
skills.charm.description: Changing someone else’s viewpoint or convincing them to do something for
  you through guile, cunning, “buttering-up”, or other such subtle techniques. It’s not about
  threatening them (that’s covered by the Harangue skill) or using cold logic to convince them
  (that’s Persuade ) but covers all those other soft-touch methods. With Charm you might be able to
  connect with an individual on a more personal level – maybe even seduce them – and such changes
  can become longheld attitudes or beliefs. If the target of the skill starts from an antagonistic
  viewpoint, some form of OPPOSED TEST will probably be needed to overcome their negative
  impression.
skills.regional-lore.name: Regional Lore
skills.regional-lore.description: Most educated people know a little bit about every place, but if
  you’ve spent a long time living in (or studying) a specific region you learn so much more. This
  skill represents a deep understanding of the people, places, and common practices that are unique
  to one particular region. Use it to recall folktales that villagers tell, unique local words, or
  unusual ruins and earthworks found in the region. It can also cover quirky superstitions and rites
  that are particular to the region.
skills.craft.name: Craft
skills.craft.description: |-
  Making and repairing sophisticated tools and structures. A job that most people could figure out does not require the Craft skill, only an INT or DEX test. Use Craft for specialized work that needs training: Craft (Mechanic) to get a broken apparatus working — or to sabotage one beyond repair; Craft (Locksmith) to open a lock without a key, and so on.

  A common specialization is Craft (Jury-Rigging) which represents an ability to create lash-ups of equipment to perform a function when the proper tool for the job is unavailable.

  The Game Moderator decides whether a task requires Craft. Each Craft type is a separate skill: Blacksmith, Carpenter, Farmer, Jury-Rigging, Locksmith, Mechanic, etc.
skills.research.name: Research
skills.research.description: The ability to find specific information in a large repository or
  buried in files, records, or ledger books. Use this skill to navigate a library catalogue system,
  pull out buried details in account records, or otherwise locate whatever relevant information lies
  buried.
skills.disguise.name: Disguise
skills.disguise.description: Alter your Protagonist’s appearance, voice, posture, body language, and
  mannerisms to avoid recognition without drawing attention.
skills.ride.name: Ride
skills.ride.description: Handling, training, and riding an animal—horses, donkeys, camels, whatever.
  Use it to keep safe on an animal in a crisis and to keep riding animals safe, calm, and healthy.
skills.dodge.name: Dodge
skills.dodge.description: Evading danger through instinct and reflexes. Use Dodge to avoid an
  attack. Against firearms and explosives, Dodge is only useful to get to cover (see DODGING RANGED
  ATTACKS on page 48).
skills.science.name: Science
skills.science.description: 'The deep study of the processes of the world. This is more than common
  schooling; anyone can attempt an INT test to remember facts from whatever (rudimentary) schooling
  they received. Science is used to find a key insight about the way the universe works — or at
  least, the way it’s supposed to work. Each Science is a separate skill: Astronomy, Biology,
  Botany, Chemistry, Engineering, Forensics, Genetics, Geology, Mathematics, Meteorology, Nutrition,
  Physics, Radio, Zoology, etc.'
skills.drive.name: Drive
skills.drive.description: Handling any ground-based vehicle or conveyance safely in a crisis. Unless
  the Game Moderator says otherwise, every Protagonist can drive safely in normal conditions. Use
  this skill to keep a vehicle safe in a tense pursuit or on dangerous terrain.
skills.search.name: Search
skills.search.description: Finding things that are concealed or obscured from plain sight. Searching
  an abandoned dwelling may not require the Search skill, only time and effort, or a sufficiently
  high INT. Use Search to find an object that was hidden with the Stealth skill or is otherwise so
  well hidden or disguised that it needs an expert. The Game Moderator may roll the Search attempt,
  so you don’t know whether your Protagonist succeeded or failed.
skills.firearms.name: Firearms
skills.firearms.description: Safe and accurate shooting with common firearms in combat. Use it to
  hit a target despite the adrenaline, panic, and shock of violence interfering with hand-eye
  coordination.
skills.social-etiquette.name: Social Etiquette
skills.social-etiquette.description: Good manners cost nothing, or so they say, and in this era they
  are an essential part of ‘civilized’ society. One simple faux pas at a dinner party can make you a
  laughingstock, or have you ejected from a prestigious club. Use this skill to know what complex
  rules of etiquette might apply in any given situation and be prepared to follow them instinctively
  when you need to. Alternative, it may be used to spot situations where someone else is failing to
  follow one of society’s many little rules.
skills.first-aid.name: First Aid
skills.first-aid.description: The initial treatment and stabilization of injuries. Use it to help a
  character recover lost Hit Points. By comparison, Surgery corrects a severe wound and Medicine
  ensures long-term recovery. (See HEALING on page 49.)
skills.stealth.name: Stealth
skills.stealth.description: Concealing your presence or activities. Use it to hide a weapon,
  camouflage a position, conceal an occult amulet, pick a pocket, move silently, follow without
  being seen, or blend into a crowd. A Protagonist attempting Stealth can be detected only by an
  opposing Alertness or Search skill (see OPPOSED TESTS on page 41).
skills.foreign-language.name: Foreign Language
skills.foreign-language.description: Fluency in another language. Each foreign language is a
  distinct skill. Having 20% allows halting conversations; at 50% your Protagonist speaks and reads
  like a native. The greater the skill, the greater the complexity of the information your
  Protagonist comprehends and the less time it takes. You don’t need to roll a Foreign Language
  skill unless the Game Moderator says the situation is exceptionally difficult.
skills.streetwise.name: Streetwise
skills.streetwise.description: In cities and towns, there is an entirely separate ‘society’ that
  exists between the criminal classes, the poor, and everybody else that the high-and-mighty would
  prefer to believe don’t exist. In fact, there are many different subcultures and groups who make
  up this (largely invisible) under-class. This skill represents detailed knowledge of one such
  strata of society. It includes extensive details about contacts – who does what and where one
  might go to obtain any kind of illicit goods or services common to that group. Some groupings may
  be region-based (e.g., “the docks”), while others represent broad categories of people or services
  (e.g., “smugglers and bootleggers”).
skills.harangue.name: Harangue
skills.harangue.description: The art of browbeating someone into agreeing with your point of view or
  agreeing to do something you want them to do. This technique is not a subtle attempt to engage
  with their good nature (that’s covered by the Charm skill) or their logical reason (that’s
  Persuade) – instead it’s all about bluster, shouting, and threats. But sometimes these can be more
  successful than other techniques, although the individuals on the receiving end are unlikely to
  enjoy the interaction quite so much.
skills.surgery.name: Surgery
skills.surgery.description: The treatment of an injury or abnormality, by invasive means. By
  comparison, First Aid keeps a patient alive until surgery is possible, and Medicine ensures long
  term recovery. (See HEALING on page 49)
skills.heavy-machinery.name: Heavy Machinery
skills.heavy-machinery.description: Safe operation of a tractor, crane, thresher, steam train, or other big machine in a crisis.
skills.survival.name: Survival
skills.survival.description: Knowledge of the natural world. Use it to plan an expedition, predict
  weather, recognize when fauna or flora are unusual, use the environment to gather other
  information, or find food, water, and shelter. Each type of Survival is its own skill. Common
  types are Desert, Jungle, Tundra, Urban.
skills.history.name: History
skills.history.description: Uncovering facts and theories about human antiquity. Use it to remember
  or find a key fact about the distant past, recognize an obscure reference, or comb through records
  that nobody without your deep education could find. While Anthropology is about living cultures
  and Archaeology studies the meaning of ancient relics, History is a broad study of humanity.
skills.swim.name: Swim
skills.swim.description: 'Most Protagonists can swim for leisure. Use the Swim skill in a dangerous
  crisis: going a long distance in choppy water, keeping a friend from drowning, or getting to a
  boat before the tentacled thing below grabs you.'
skills.insight.name: Insight
skills.insight.description: |-
  Insight obtains information about a person — especially information the subject would rather conceal — through observation, conversation, or examining patterns of behavior and relationships. Use Insight to recognize signs of dishonesty from verbal cues and body language, gauge attitude and intentions, cultivate sources of information about a subject, determine what it would take to get a subject to cooperate, or recognize clues of what a subject wants to conceal.

  Insight can notice signs of mental illness but Psychoanalyze would be needed to assist with a specific malady. A subject who deliberately tries to deceive your Protagonist can attempt an opposed test comparing their Persuade against your Protagonist’s Insight (see OPPOSED TESTS on page 41).
skills.track.name: Track
skills.track.description: Use this to locate the tracks of a specific creature or person and follow
  them. A test must be made to locate the trail and then again once every ten minutes they are being
  followed. Penalties or bonuses may apply depending on how long it was since the tracks were made,
  what the ground is like, what the weather conditions have been since the tracks were made, etc.
skills.law.name: Law
skills.law.description: |-
  Use this skill to understand and manipulate the power structures that exist within society, to either influence outcomes or bullshit your Protagonist’s way out of trouble.

  Different societies have their own systems of law – the understanding of each is a separate skill. Because all societies are based on common human behavior, you can attempt to use your Law skill at half chance to navigate the vagaries of a an entirely new and unfamiliar social order.
skills.unarmed-combat.name: Unarmed Combat
skills.unarmed-combat.description: Self-defense. A fight between untrained combatants often involves
  more shoving and shouting than real violence. Use Unarmed Combat to hurt or kill an opponent with
  your Protagonist’s bare hands (or feet, elbows, teeth, or head).
skills.medicine.name: Medicine
skills.medicine.description: The study and treatment of injury and illness. Use it to diagnose the
  cause of an injury, disease, or poisoning, identify abnormalities such as toxins or diseases,
  identify the cause and approximate time of death, identify a dead person’s last meal, or prescribe
  proper long-term care. By comparison, First Aid keeps a patient alive until surgery is possible,
  and Surgery corrects a severe wound. (See HEALING on page 49).
skills.unnatural.name: Unnatural
skills.unnatural.description: Knowledge of the fundamental, mind-shattering secrets of the universe.
  The things that slithered in the dark corners of the world and the cosmos beyond. Use it to
  remember, recognize, or research facts about the things humans consider unnatural. This goes far
  beyond the occult, because the Unnatural skill represents things that are real. Use it to sift
  through the darkest parts of myth and folklore and recognize which of it is true.
skills.melee-weapons.name: Melee Weapons
skills.melee-weapons.description: Lethal use of melee weapons in combat. Use it to hurt or kill an
  opponent with a knife, axe, club, or other hand-held weapon.
skills.use-gadgets.name: Use Gadgets
skills.use-gadgets.description: Nobody needs to make a skill roll to use devices and technologies
  that are in common use in the era and setting of the game. However, making effective use of
  highly-specialized or technical apparatus is a different question. In the hands on the untrained,
  such devices are at best useless, and at worst dangerous. Use Gadgets is an umbrella skill
  allowing your Protagonist to successfully use all manner of common technical devices.
