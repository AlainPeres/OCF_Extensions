creatures.wyvern.name: Wyvern
creatures.wyvern.description: 'Wyvern Sting Poison:  Type: Ingested. Delay: 1D2 Combat Rounds. Potency: 60. Full Effect: 1D6 Hit Point damage, applies –4 penalty to victim’s CON. Duration: 6D10 minutes.'
