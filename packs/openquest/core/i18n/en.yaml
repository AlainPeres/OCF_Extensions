creatures.werewolf-wolf.name: Werewolf (wolf form)
creatures.werewolf.description: 'Night Vision. Shape-shifting at will in a combat round (forced on nights of a full moon): STR doubled and INT halved as a wolf. Only silver or magic harms a werewolf.'
creatures.werewolf-wolf.description: 'Night Vision. Shape-shifting at will in a combat round (forced on nights of a full moon): STR doubled and INT halved as a wolf. Only silver or magic harms a werewolf.'

