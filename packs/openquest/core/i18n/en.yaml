creatures.elemental-small.name: Elemental (Small)
creatures.elemental-small.description: 'Engulfs every opponent within 1 m: undines drown, salamanders burn, gnomes crush, sylphs bluster (Resilience against hit points), shades frighten (Persistence against magic points). Its damage has no damage modifier. Immune to disease and poison; sees the invisible (+50% to detect hidden characters); nearly invisible in its own element (Deception 90%).'
