<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Creator</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --card: #fff;
        --ink: #1d1d1f;
        --muted: #6b6b70;
        --line: #deddd8;
        --accent: #2f5d8a;
        --accent-ink: #fff;
        --rec: #e6f0f9;
        --bad: #a3271f;
        --ok: #2c6e3f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a;
          --card: #222326;
          --ink: #ececee;
          --muted: #a0a0a6;
          --line: #38393d;
          --accent: #6ea4d8;
          --accent-ink: #111;
          --rec: #233447;
          --bad: #f08a80;
          --ok: #7fcf95;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 {
        font-size: 16px;
        margin: 0 12px 0 0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
        max-width: 1400px;
        margin: 0 auto;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      h3 {
        font-size: 15px;
        margin: 4px 0 8px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      button.rec {
        background: var(--rec);
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select {
        font: inherit;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
      }
      input[type='number'] {
        width: 5em;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        padding: 3px 6px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 420px;
        overflow: auto;
      }
      .options button {
        text-align: left;
      }
      .start {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 6px;
      }
      .start small {
        display: block;
        color: var(--muted);
      }
      .msg {
        padding: 6px 10px;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      .msg.err {
        background: color-mix(in srgb, var(--bad) 15%, transparent);
        color: var(--bad);
      }
      .msg.ok {
        background: color-mix(in srgb, var(--ok) 15%, transparent);
        color: var(--ok);
      }
      ul.issues {
        margin: 0;
        padding-left: 18px;
        color: var(--bad);
      }
      .copy {
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      .copy .state {
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 0 6px;
        border-radius: 9px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        max-height: 400px;
        overflow: auto;
      }
      details > summary {
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Universal Creator</h1>
      <select id="pack" title="Pack"></select>
      <input id="newId" placeholder="file ID (optional)" size="18" />
      <button class="primary" id="btnNew">New character</button>
      <span class="muted">or</span>
      <select id="charList" title="Saved characters"></select>
      <button id="btnLoad">Load</button>
    </header>
    <main>
      <div>
        <div id="messages"></div>
        <section id="secStart" class="hidden">
          <h2>Creation</h2>
          <div id="starts"></div>
        </section>
        <section id="secPause" class="hidden">
          <h2 id="pauseAction"></h2>
          <h3 id="pauseTitle"></h3>
          <div id="pauseBody"></div>
        </section>
        <section id="secForm" class="hidden">
          <h2>Action</h2>
          <h3 id="formTitle"></h3>
          <div id="formBody"></div>
        </section>
        <section id="secActions" class="hidden">
          <h2>Actions</h2>
          <div class="row" id="actions"></div>
          <details id="otherBox">
            <summary class="muted">Other actions</summary>
            <div class="row" id="otherActions"></div>
          </details>
        </section>
        <section id="secInputs" class="hidden">
          <details>
            <summary><h2 style="display: inline">Input fields</h2></summary>
            <table id="inputs"></table>
          </details>
        </section>
      </div>
      <div>
        <section id="secSheet" class="hidden">
          <h2>Character <span id="status" class="badge"></span></h2>
          <div id="issues"></div>
          <div id="groups"></div>
          <h2 style="margin-top: 12px">Content</h2>
          <div id="copies"></div>
          <div class="row" style="margin-top: 12px">
            <input id="saveFile" placeholder="file name" size="24" />
            <button class="primary" id="btnSave">Save to examples/characters</button>
            <button id="btnYaml">Show YAML</button>
          </div>
          <pre id="yaml" class="hidden"></pre>
        </section>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      let state = null; // the server's last view

      async function api(path, body) {
        const res = await fetch(
          path,
          body === undefined
            ? {}
            : {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(body),
              },
        );
        const type = res.headers.get('content-type') || '';
        const data = type.includes('json') ? await res.json() : await res.text();
        if (!res.ok) throw new Error(data.error || data || res.statusText);
        return data;
      }
      function flash(text, kind = 'ok') {
        $('messages').innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : '';
      }
      async function call(path, body) {
        try {
          const v = await api(path, body);
          render(v);
          return v;
        } catch (e) {
          flash(e.message, 'err');
        }
      }

      // ---- Packs and characters
      async function init() {
        const packs = await api('/api/packs');
        $('pack').innerHTML = packs
          .map(
            (p) =>
              `<option value="${esc(p.id)}">${esc(p.name)}${p.creation ? '' : ' (no creation start)'}</option>`,
          )
          .join('');
        const last = localStorageGet('pack');
        if (last && packs.some((p) => p.id === last)) $('pack').value = last;
        await listCharacters();
      }
      function localStorageGet(k) {
        try {
          return localStorage.getItem('uc.' + k);
        } catch {
          return null;
        }
      }
      function localStorageSet(k, v) {
        try {
          localStorage.setItem('uc.' + k, v);
        } catch {}
      }
      async function listCharacters() {
        const list = await api('/api/characters?pack=' + encodeURIComponent($('pack').value));
        $('charList').innerHTML = list.length
          ? list.map((f) => `<option>${esc(f)}</option>`).join('')
          : '<option value="">(none for this pack)</option>';
      }
      $('pack').onchange = () => {
        localStorageSet('pack', $('pack').value);
        listCharacters();
      };
      $('btnNew').onclick = () =>
        call('/api/new', { pack: $('pack').value, id: $('newId').value.trim() });
      $('btnLoad').onclick = () =>
        $('charList').value &&
        call('/api/load', { pack: $('pack').value, file: $('charList').value });

      // ---- Rendering
      function render(v) {
        state = v;
        $('formBody').innerHTML = '';
        $('secForm').classList.add('hidden');
        flash(v.error || v.message || '', v.error ? 'err' : 'ok');
        const busy = !!v.paused;
        // Creation starts while the character is being created and nothing is paused.
        $('secStart').classList.toggle('hidden', !(v.creating && !busy && v.starts.length));
        $('starts').innerHTML = v.starts
          .map(
            (s, i) =>
              `<button class="start" data-i="${i}"><b>${esc(s.name)}</b>${s.random ? ' <span class="badge">automatic</span>' : ''}<small>${esc(s.description)}</small></button>`,
          )
          .join('');
        $('starts')
          .querySelectorAll('button')
          .forEach(
            (b) =>
              (b.onclick = () => {
                const s = v.starts[b.dataset.i];
                call('/api/start', { sid: v.sid, start: s.id, startPack: s.pack });
              }),
          );
        renderPause(v);
        // The actions the rules offer now, those tagged `creation` first, the others folded away; the
        // creation starts' own actions run from the starts.
        const acts = v.actions.filter((a) => !a.start && !a.entry); // the items' actions are for play
        const main = acts.filter((a) => a.forCreation);
        const other = acts.filter((a) => !a.forCreation);
        $('secActions').classList.toggle('hidden', busy || !acts.length);
        const buttons = (list, box) => {
          $(box).innerHTML = list
            .map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`)
            .join('');
          $(box)
            .querySelectorAll('button')
            .forEach((b) => (b.onclick = () => openForm(list[b.dataset.i])));
        };
        buttons(main, 'actions');
        buttons(other, 'otherActions');
        $('actions').classList.toggle('hidden', !main.length);
        $('otherBox').classList.toggle('hidden', !other.length);
        if (!main.length) $('otherBox').open = true; // nothing tagged: show them all
        renderInputs(v);
        renderSheet(v);
      }

      function renderPause(v) {
        const p = v.paused;
        $('secPause').classList.toggle('hidden', !p);
        if (!p) return;
        $('pauseAction').textContent = p.action;
        $('pauseTitle').textContent = p.title;
        const body = $('pauseBody');
        const footer = (recAnswer) => `
    <div class="row" style="margin-top:10px">
      ${recAnswer ? '<button id="pAuto">Finish automatically</button>' : ''}
      <button id="pCancel">Cancel action</button>
    </div>`;
        const answer = (a, auto = false) => call('/api/answer', { sid: v.sid, answer: a, auto });
        if (p.unsupported) {
          body.innerHTML =
            `<p class="msg err">This page cannot answer a ${esc(p.kind)} pause.</p>` +
            footer(false);
        } else if (p.kind === 'choice') {
          const many = p.options.length > 12;
          body.innerHTML =
            `
      ${many ? '<input id="pFilter" placeholder="filter…" style="width:100%;margin-bottom:6px">' : ''}
      <div class="options" id="pOptions">${p.options
        .map(
          (o) =>
            `<button data-id="${esc(o.id)}" class="${o.id === p.recommended ? 'rec' : ''}">${esc(o.label)}${o.id === p.recommended ? ' <span class="badge">recommended</span>' : ''}</button>`,
        )
        .join('')}</div>` + footer(p.recommended !== undefined);
          body
            .querySelectorAll('#pOptions button')
            .forEach((b) => (b.onclick = () => answer({ option: b.dataset.id })));
          if (many)
            $('pFilter').oninput = (e) => {
              const q = e.target.value.toLowerCase();
              body
                .querySelectorAll('#pOptions button')
                .forEach((b) =>
                  b.classList.toggle('hidden', !b.textContent.toLowerCase().includes(q)),
                );
            };
          if (p.recommended !== undefined)
            $('pAuto').onclick = () => answer({ option: p.recommended }, true);
        } else if (p.kind === 'allocate') {
          renderAllocate(p, body, footer, answer);
        } else if (p.kind === 'dice') {
          body.innerHTML =
            `<p>${esc(p.dice || '')}</p><p class="muted">The engine rolls the dice for this page.</p>` +
            footer(false);
        }
        $('pCancel').onclick = () => call('/api/cancel', { sid: v.sid });
      }

      function renderAllocate(p, body, footer, answer) {
        const a = p.allocate;
        const rec = a.recommended || {};
        if (a.values) {
          // Each value to a different field.
          const opts = (sel) =>
            `<option value=""></option>` +
            a.values
              .map(
                (x, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(x)}</option>`,
              )
              .join('');
          const pre = {}; // recommended value index per field
          const used = new Set();
          for (const f of a.fields)
            if (rec[f.id] !== undefined) {
              const i = a.values.findIndex((x, j) => x === rec[f.id] && !used.has(j));
              if (i >= 0) {
                used.add(i);
                pre[f.id] = i;
              }
            }
          body.innerHTML =
            `<p class="muted">Give each value to a different field: ${a.values.map(esc).join(', ')}.</p>
      <table><tr><th></th><th class="num">Now</th><th>Value</th></tr>${a.fields
        .map(
          (f) =>
            `<tr><td>${esc(f.label)}</td><td class="num">${esc(f.value)}</td><td><select data-id="${esc(f.id)}">${opts(pre[f.id])}</select></td></tr>`,
        )
        .join('')}</table>
      <div class="row"><button class="primary" id="aOk">Confirm</button><span id="aInfo" class="muted"></span></div>` +
            footer(a.recommended !== undefined);
          const read = () => {
            const amounts = {};
            const seen = new Set();
            let ok = true;
            body.querySelectorAll('select').forEach((s) => {
              if (s.value === '') return;
              if (seen.has(s.value)) ok = false;
              seen.add(s.value);
              amounts[s.dataset.id] = a.values[Number(s.value)];
            });
            return { amounts, ok: ok && seen.size === a.values.length };
          };
          const check = () => {
            const r = read();
            $('aOk').disabled = !r.ok;
            $('aInfo').textContent = r.ok ? '' : 'Use every value once.';
          };
          body.querySelectorAll('select').forEach((s) => (s.onchange = check));
          check();
          $('aOk').onclick = () => answer({ amounts: read().amounts });
        } else {
          // A budget: the cost of each amount is in `costs`, from 0 to the field's limit.
          body.innerHTML =
            `<table><tr><th></th><th class="num">Now</th><th class="num">Add</th><th class="num">Cost</th><th class="num">Result</th></tr>${a.fields
              .map(
                (f) => `<tr><td>${esc(f.label)}</td><td class="num">${esc(f.value)}</td>
        <td class="num"><input type="number" min="0" ${f.limit !== undefined ? `max="${f.limit}"` : ''} value="${rec[f.id] ?? 0}" data-id="${esc(f.id)}"></td>
        <td class="num" data-cost="${esc(f.id)}"></td><td class="num" data-res="${esc(f.id)}"></td></tr>`,
              )
              .join('')}</table>
      <div class="row"><b id="aSpent"></b><span class="muted">/ ${esc(a.budget)} ${a.spend === 'upTo' ? '(at most)' : '(all of it)'}</span></div>
      <div class="row"><button class="primary" id="aOk">Confirm</button><button id="aZero">Clear</button>${a.recommended ? '<button id="aRec">Recommendation</button>' : ''}</div>` +
            footer(a.recommended !== undefined);
          const fields = Object.fromEntries(a.fields.map((f) => [f.id, f]));
          const cost = (f, n) => (n <= 0 ? 0 : f.costs && n < f.costs.length ? f.costs[n] : NaN);
          const check = () => {
            let spent = 0;
            let ok = true;
            body.querySelectorAll('input[data-id]').forEach((i) => {
              const f = fields[i.dataset.id];
              const n = Math.max(0, Math.floor(Number(i.value) || 0));
              const c = cost(f, n);
              if (f.limit !== undefined && n > f.limit) ok = false;
              spent += c;
              body.querySelector(`[data-cost="${CSS.escape(f.id)}"]`).textContent = n
                ? Number.isNaN(c)
                  ? '?'
                  : c
                : '';
              body.querySelector(`[data-res="${CSS.escape(f.id)}"]`).textContent = n
                ? f.value + n
                : '';
            });
            const fits =
              !Number.isNaN(spent) && (a.spend === 'upTo' ? spent <= a.budget : spent === a.budget);
            $('aSpent').textContent = Number.isNaN(spent) ? 'Spent: ?' : `Spent: ${spent}`;
            $('aSpent').style.color = fits && ok ? '' : 'var(--bad)';
            $('aOk').disabled = !(fits && ok);
          };
          body.querySelectorAll('input[data-id]').forEach((i) => (i.oninput = check));
          $('aZero').onclick = () => {
            body.querySelectorAll('input[data-id]').forEach((i) => (i.value = 0));
            check();
          };
          if (a.recommended)
            $('aRec').onclick = () => {
              body
                .querySelectorAll('input[data-id]')
                .forEach((i) => (i.value = rec[i.dataset.id] ?? 0));
              check();
            };
          check();
          $('aOk').onclick = () => {
            const amounts = {};
            body.querySelectorAll('input[data-id]').forEach((i) => {
              const n = Math.floor(Number(i.value) || 0);
              if (n > 0) amounts[i.dataset.id] = n;
            });
            answer({ amounts });
          };
        }
        if (a.recommended !== undefined && $('pAuto'))
          $('pAuto').onclick = () => answer({ amounts: a.recommended }, true);
      }

      // ---- Action forms, from describeAction
      async function openForm(action) {
        let d;
        try {
          d = await api('/api/describe', { sid: state.sid, action: action.id });
        } catch (e) {
          return flash(e.message, 'err');
        }
        if (d.error) return flash(d.error, 'err');
        $('secForm').classList.remove('hidden');
        $('formTitle').textContent = d.label;
        const input = (p) => {
          const name = `data-name="${esc(p.name)}"`;
          if (p.options)
            return `<select ${name}>${p.required ? '' : '<option value=""></option>'}${p.options.map((o) => `<option value="${esc(o.id)}" ${o.id === p.default ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
          if (p.values)
            return `<select ${name}>${p.required ? '' : '<option value=""></option>'}${p.values.map((o) => `<option value="${esc(o.id)}" ${o.id === p.default ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
          if (p.type === 'boolean')
            return `<input type="checkbox" ${name} ${p.default ? 'checked' : ''}>`;
          if (p.type === 'integer' || p.type === 'decimal')
            return `<input type="number" ${name} ${p.min !== undefined ? `min="${p.min}"` : ''} ${p.max !== undefined ? `max="${p.max}"` : ''} ${p.type === 'decimal' ? 'step="any"' : ''} value="${p.default ?? ''}">`;
          return `<input ${name} value="${esc(p.default ?? '')}" size="28">`;
        };
        $('formBody').innerHTML = `<table>${
          d.params
            .map(
              (p) =>
                `<tr><td>${esc(p.label)}${p.required ? ' *' : ''}</td><td>${input(p)}</td></tr>`,
            )
            .join('') || '<tr><td class="muted">No parameters.</td></tr>'
        }</table>
    <div class="row"><button class="primary" id="fRun">Run</button><button id="fAuto">Run automatically</button><button id="fClose">Close</button></div>`;
        const read = () => {
          const params = {};
          for (const p of d.params) {
            const el = $('formBody').querySelector(`[data-name="${CSS.escape(p.name)}"]`);
            if (p.type === 'boolean') params[p.name] = el.checked;
            else if (el.value === '') continue;
            else if (p.type === 'integer') params[p.name] = Math.trunc(Number(el.value));
            else if (p.type === 'decimal') params[p.name] = Number(el.value);
            else params[p.name] = el.value;
          }
          return params;
        };
        $('fRun').onclick = () =>
          call('/api/run', { sid: state.sid, action: action.id, params: read() });
        $('fAuto').onclick = () =>
          call('/api/run', { sid: state.sid, action: action.id, params: read(), auto: true });
        $('fClose').onclick = () => $('secForm').classList.add('hidden');
      }

      // ---- Input fields: a `set` change each
      function renderInputs(v) {
        $('secInputs').classList.toggle('hidden', !!v.paused || !v.inputs.length);
        $('inputs').innerHTML = v.inputs
          .map((f, i) => {
            const id = `data-i="${i}"`;
            let el;
            if (f.values)
              el = `<select ${id}>${f.values.map((o) => `<option value="${esc(o.id)}" ${o.id === f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
            else if (f.type === 'boolean')
              el = `<input type="checkbox" ${id} ${f.value ? 'checked' : ''}>`;
            else if (f.type === 'integer' || f.type === 'decimal')
              el = `<input type="number" ${id} ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''} value="${esc(f.value)}">`;
            else el = `<input ${id} value="${esc(f.value)}" size="40">`;
            return `<tr><td>${esc(f.label)}</td><td>${el}</td></tr>`;
          })
          .join('');
        $('inputs')
          .querySelectorAll('[data-i]')
          .forEach(
            (el) =>
              (el.onchange = () => {
                const f = v.inputs[el.dataset.i];
                const value =
                  f.type === 'boolean'
                    ? el.checked
                    : f.type === 'integer'
                      ? Math.trunc(Number(el.value))
                      : f.type === 'decimal'
                        ? Number(el.value)
                        : el.value;
                call('/api/set', { sid: v.sid, field: f.id, value });
              }),
          );
      }

      // ---- The sheet
      function renderSheet(v) {
        $('secSheet').classList.remove('hidden');
        $('status').textContent = v.creating ? 'being created' : 'created';
        $('issues').innerHTML =
          (v.issues.length
            ? `<ul class="issues">${v.issues.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`
            : '') + (v.pending ? `<p class="muted">${v.pending} choice(s) still pending.</p>` : '');
        $('groups').innerHTML = v.groups
          .map(
            (g) =>
              `<h3>${esc(g.label)}</h3><table>${g.fields.map((f) => `<tr><td>${esc(f.label)}</td><td class="num">${esc(f.value)}</td></tr>`).join('')}</table>`,
          )
          .join('');
        $('copies').innerHTML = v.copies.length
          ? v.copies
              .map(
                (
                  c,
                ) => `<div class="copy"><b>${esc(c.label)}</b> <span class="badge">${esc(c.type)}</span>${c.equipped ? ' <span class="badge">equipped</span>' : ''}${c.quantity !== undefined ? ` ×${esc(c.quantity)}` : ''}
          ${c.state.length || c.computed.length ? `<div class="state">${[...c.state.map((s) => `${esc(s.label)}: ${esc(s.value)}`), ...c.computed.map((s) => `${esc(s.key)}: ${esc(s.value)}`)].join(' · ')}</div>` : ''}</div>`,
              )
              .join('')
          : '<p class="muted">Nothing yet.</p>';
        if (!$('saveFile').value || $('saveFile').dataset.sid !== v.sid) {
          $('saveFile').value = v.file || `extensions/${v.character.id}.yaml`;
          $('saveFile').dataset.sid = v.sid;
        }
        if (!$('yaml').classList.contains('hidden')) showYaml();
      }
      async function showYaml() {
        $('yaml').textContent = await api('/api/yaml', { sid: state.sid });
      }
      $('btnYaml').onclick = async () => {
        $('yaml').classList.toggle('hidden');
        if (!$('yaml').classList.contains('hidden')) showYaml();
      };
      $('btnSave').onclick = async () => {
        try {
          const r = await api('/api/save', {
            sid: state.sid,
            file: $('saveFile').value.trim(),
          }).catch(async (e) => {
            if (!/already exists/.test(e.message) || !confirm(e.message + '. Overwrite?')) throw e;
            return api('/api/save', {
              sid: state.sid,
              file: $('saveFile').value.trim(),
              overwrite: true,
            });
          });
          flash('Saved: ' + r.saved);
          listCharacters();
        } catch (e) {
          flash(e.message, 'err');
        }
      };

      init().catch((e) => flash(e.message, 'err'));
    </script>
  </body>
</html>
